[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubetrim"
version = "0.1.0"
description = "Zero-agent Kubernetes FinOps and pod rightsizing patch generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alexandr Motologa", email = "alexandr.motologa@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.55.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "ruamel.yaml>=0.18.6",
    "kubernetes>=29.0.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.5",
]

[project.scripts]
kubetrim = "kubetrim.cli.main:app"

[project.urls]
Homepage = "https://github.com/alexandrmotologa/kubetrim"
Documentation = "https://github.com/alexandrmotologa/kubetrim#readme"
Repository = "https://github.com/alexandrmotologa/kubetrim"
Issues = "https://github.com/alexandrmotologa/kubetrim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
